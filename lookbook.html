<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lookbook | Photrix</title>
    <!-- Lenis CSS for smooth scrolling -->
    <link rel="stylesheet" href="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.css">
    <!-- Link to your Custom CSS -->
    <link rel="stylesheet" href="./lookbook.css">
</head>
<body class="theme-default">

    <!-- 🌐 GLOBAL OFFLINE BANNER — same pattern as the dashboard. Shown/hidden
         by lookbook.js via the browser's online/offline events. -->
    <div id="lookbookOfflineBanner" style="display:none;">
        ⚠️ You're offline — reconnect to select, submit, or download photos.
    </div>

    <!-- Top Navigation Bar -->
    <header class="lookbook-header">
        <div class="logo">PHOTRIX</div>
        <!-- Theme dropdown removed: Client should only see what Photographer selects -->

        <!-- 🆕 MOVED HERE from the bottom floating dock, per photographer's
             request: keeps the photo grid (green zone) completely clean —
             no floating bar sitting over thumbnails while the client
             browses. Same element id/classes lookbook.js already targets
             (getElementById("action-footer") etc.), so no JS changes needed
             at all — only where it physically lives in the page moved. -->
        <div id="action-footer" class="header-action-bar" style="display: none;">
            <div id="counter-zone" class="counter-badge">
                Selected: <span id="selected-count">0</span> / <span id="selection-limit-label">40</span>
            </div>
            <div class="dock-actions">
                <button id="submit-selection-btn" class="btn-primary">
                    <svg class="btn-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
                    <span class="btn-label">Submit Selection</span>
                </button>
                <button id="download-zip-btn" class="btn-secondary" style="display: none;">
                    <svg class="btn-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    <span class="btn-label">Download ZIP</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="lookbook-hero">
        <h1 id="couple-names">Loading Gallery...</h1>
        <p id="gallery-sub-status">Please wait while we fetch your memories.</p>
        <div id="undo-submit-bar" style="display:none; margin-top:18px;">
            <button id="undo-submit-btn" class="btn-secondary">Undo Submission (<span id="undo-seconds">30</span>s)</button>
        </div>
    </section>

    <!-- PIN Gate Modal Overlay (HTML structure fixed) -->
    <div id="gallery-pin-gate" class="pin-modal-overlay" style="display:none;">
        <div class="pin-modal-card">
            <h3>Enter Gallery PIN</h3>
            <p>Enter the 6-digit gallery PIN shared by your photographer.</p>
            <input type="password" id="gallery-pin-input" maxlength="6" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" placeholder="------" >
        </div>
    </div>

    <!-- Main Photo Masonry Grid -->
    <main class="lookbook-main-container">
        <div id="main-photo-grid" class="masonry-grid"></div>
    </main>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-functions-compat.js"></script>
    
    <!-- Utilities & Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    
    <!-- Main JS logic -->
    <script src="./lookbook.js"></script>
</body>
</html>
